# Market regimes (src/regime_fusion/regimes/market.py).
#
# Settled by the pilot on 2015-2018 data only and frozen with the protocol on 31 October 2026.
# The regimes are fitted on the S&P 500 index so that all stocks share them. States are ordered
# by the mean of a set's `order_by` input (state 0 has the lowest), or of its first input.

series: GSPC            # interim/market/<series>.parquet
n_states: 2
restarts: 10            # random starts of each EM fit; seeds from regime_fusion.seeds

inputs:
  volatility:           # rung A2: log annualised realised volatility over the last `window` sessions
    window: 20
  dc:                   # rung A3: directional changes of the index at `threshold`
    threshold: 0.005    # A3's choice (docs/PROTOCOL.md, section 9): at 1% a state held under 15% of the days; the pilot's A3 ran at 1%
    window: 20
  dc_news:              # rung A4: the dc inputs plus directional changes of news attention
    threshold: 0.005    # A3's choice (docs/PROTOCOL.md, section 9): at 1% a state held under 15% of the days
    window: 20
    order_by: news_log_events  # news events tell A4's states apart (state 0: few lately); its price events hardly do
    attention:
      scope: market     # market: the 50 main stocks' news together, regimes shared by all stocks (the plan);
                        # stock: each stock's own news, regimes per stock (an option, not used)
      sessions: 5       # attention level: 1 + articles over the last `sessions` sessions
      threshold: 0.25   # absolute, on the log level: a rise or fall of about 28%
      window: 20
  # Alternatives the pilot compares (docs/PROTOCOL.md, section 9), on 2015-2018 data only.
  # `kind` says which inputs an alternative computes.
  dc_fine:              # rung A3-fine: directional changes of the index at 0.5%, the setting A3 took after the pilot
    kind: dc
    threshold: 0.005
    window: 20
  dc_news_wide:         # rung A4-wide: a news-attention threshold of 0.5 (a rise of about 65%)
    kind: dc_news
    threshold: 0.005    # A3's choice, as for dc_news
    window: 20
    order_by: news_log_events
    attention:
      scope: market
      sessions: 5
      threshold: 0.5
      window: 20
