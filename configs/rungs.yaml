# The ablation ladder and the GP baselines (docs/RESEARCH_PLAN.md, docs/ENGINE.md).
#
# Each rung changes one thing from the rung it extends. The population, generations and
# tournament size come from the GP-parameter pilot (docs/PROTOCOL.md, section 9.1, on 2015-2018
# data only; 30 October 2026); ActTrade's were 1,000, 50 and 4. The other GP parameters are
# ActTrade's (Table 5 of the paper).

gp:
  population: 2000
  generations: 40
  crossover: 0.95
  tournament: 4
  initial_depth: 2          # branch depth; ActTrade's initial depth 3 counts its 3-AND root
  max_branch_depth: 5       # ActTrade's maximum depth 6 counts its root
  flip: 0.5
  elitism: 1
  first_parent: [0.4, 0.2, 0.2, 0.2]
  particularity: 20.0       # DALex

fitness:
  # ActTrade's values are published nowhere (its code reads them from the command line); its
  # paper and thesis call the fitness the summation of the four Sharpe ratios, which equal
  # weights reproduce: 0.25 each ranks trees exactly as the plain sum does (docs/ENGINE.md).
  weights: {C: 0.25, FA: 0.25, SA: 0.25, TA: 0.25}
  min_trades: 3             # ActTrade: six buys and sells
  blocks: 8                 # lexicase time blocks (half-years of a four-year window)

scaling: minmax             # or rank; see src/regime_fusion/engine/panel.py

# The GP-parameter pilot (docs/PROTOCOL.md, section 9), on 2015-2018 data only: each population
# size, with tournaments of 2 and 4, at the same budget of evaluations, for the rungs below. The
# candidates are generated as rungs named <rung>-p<population>-t<tournament> (A1-p500-t2, ...).
gp_pilot:
  rungs: [A1, A3]
  populations: [250, 500, 1000, 2000]
  tournaments: [2, 4]
  evaluations: 100000       # population x generations (twice ActTrade's 1,000 x 50)

# Headlines of the FinBERT check by test year (MK, 29 October 2026). A window uses one source
# throughout: FNSPID ends in December 2023, and GDELT's page titles begin on 23 September 2019,
# so they cover the whole window of 2024 and 2025. Stock-years whose window the source does
# not cover are left out of the check (docs/DATA.md).
finbert_sources:
  fnspid: [2019, 2020, 2021, 2022, 2023]
  gdelt: [2024, 2025]

exit_grid:                  # candidates for (d, r), chosen per stock-year on the validation year
  days: [5, 10, 20, 30]
  rates: [0.01, 0.02, 0.03, 0.05]
  runs: 5                   # A0 runs per candidate

rungs:
  A0: {sources: [FA, SA, TA], fusion: [], regimes: null, active_trading: true, selection: tournament}
  A1: {extends: A0, fusion: [AND, OR, ALL, ANY, VOTE]}
  A2: {extends: A1, fusion: [AND, OR, ALL, ANY, VOTE, IF], regimes: volatility}
  A3: {extends: A2, regimes: dc}
  A4: {extends: A3, regimes: dc_news}
  A5: {extends: A4, selection: lexicase}
  A5-dalex: {extends: A4, selection: dalex}
  # Single-type GP baselines: one branch, no active trading operator (it needs three).
  GP-FA: {sources: [FA], fusion: [], regimes: null, active_trading: false, selection: tournament,
          weights: {C: 1.0}}
  GP-SA: {extends: GP-FA, sources: [SA]}
  GP-TA: {extends: GP-FA, sources: [TA]}
  # Robustness check (option B): FinBERT headline sentiment joins the sentiment branch, from the
  # source below. The best rung of the main results gets the same treatment once known.
  A0-FB: {extends: A0, finbert: true}
  A1-FB: {extends: A1, finbert: true}
  # Alternatives the pilot compares (docs/PROTOCOL.md, section 9), on 2015-2018 data only.
  A1-rank: {extends: A1, scaling: rank}
  A3-fine: {extends: A3, regimes: dc_fine}
  A4-wide: {extends: A4, regimes: dc_news_wide}
