# Company names for matching news records (docs/DATA.md, News).
#
# anchors: lower-case regular expressions, matched as whole words within the
#   organisation names GDELT extracts from each article. They pick the records
#   kept from GDELT's raw files and are broad on purpose ("ford" also finds the
#   Ford Foundation): the exact matching is done later, on the stored records,
#   so it can be refined without downloading GDELT again. A few names that would
#   flood the store are narrowed (Nasdaq the company, not the exchange).
#
# Changing anchors after extraction means re-extracting the affected days; the
# anchors' digest is recorded with every extracted day.

stocks:
