# Accounting inputs taken point-in-time from SEC filings (src/regime_fusion/data/fundamentals.py).
#
# They feed ActTrade's twelve fundamental indicators (docs/DECISIONS.md;
# src/regime_fusion/data/fa.py): net profit ratio, return on equity, quick ratio,
# P/E, P/B and P/S ratios, debt to equity, total revenues, EBITDA, levered free
# cash flow, diluted EPS and R&D expenses.
#
# Each concept lists XBRL tags in order of preference ("taxonomy:concept").
# flow:    income and cash-flow items, as trailing-twelve-month values
# instant: balance-sheet items, at the latest period end
# latest:  period averages (the diluted share count), from the latest, shortest period
# Units default to USD.

concepts:
  revenue:
    kind: flow
    tags:
      - us-gaap:Revenues
      - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
      - us-gaap:SalesRevenueNet
      - us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax
      - us-gaap:SalesRevenueGoodsNet
      - us-gaap:RevenuesNetOfInterestExpense   # banks' quarterly revenue
  operating_income:
    kind: flow
    tags: [us-gaap:OperatingIncomeLoss]
  net_income:
    kind: flow
    tags:
      - us-gaap:NetIncomeLoss
      - us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic
      - us-gaap:ProfitLoss
  pretax_income:   # EBITDA's fallback when a firm has no operating-income line
    kind: flow
    tags:
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
  interest_expense:
    kind: flow
    tags: [us-gaap:InterestExpense, us-gaap:InterestExpenseDebt, us-gaap:InterestExpenseNonoperating]
  net_interest_income:   # with non-interest income, banks' revenue
    kind: flow
    tags: [us-gaap:InterestIncomeExpenseNet]
  noninterest_income:
    kind: flow
    tags: [us-gaap:NoninterestIncome]
  depreciation_amortization:
    kind: flow
    tags:
      - us-gaap:DepreciationDepletionAndAmortization
      - us-gaap:DepreciationAndAmortization
      - us-gaap:DepreciationAmortizationAndAccretionNet
      - us-gaap:Depreciation
  operating_cash_flow:
    kind: flow
    tags:
      - us-gaap:NetCashProvidedByUsedInOperatingActivities
      - us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
  capital_expenditure:
    kind: flow
    tags:
      - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
      - us-gaap:PaymentsToAcquireProductiveAssets
  research_development:
    kind: flow
    tags:
      - us-gaap:ResearchAndDevelopmentExpense
      - us-gaap:ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost
  assets:
    kind: instant
    tags: [us-gaap:Assets]
  liabilities:
    kind: instant
    tags: [us-gaap:Liabilities]
  equity:
    kind: instant
    tags:
      - us-gaap:StockholdersEquity
      - us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  current_assets:
    kind: instant
    tags: [us-gaap:AssetsCurrent]
  inventory:
    kind: instant
    tags: [us-gaap:InventoryNet]
  current_liabilities:
    kind: instant
    tags: [us-gaap:LiabilitiesCurrent]
  cash:
    kind: instant
    tags:
      - us-gaap:CashAndCashEquivalentsAtCarryingValue
      - us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
  long_term_debt:
    kind: instant
    tags:
      - us-gaap:LongTermDebtNoncurrent
      - us-gaap:LongTermDebt
      - us-gaap:LongTermDebtAndCapitalLeaseObligations
  current_debt:
    kind: instant
    tags:
      - us-gaap:DebtCurrent
      - us-gaap:LongTermDebtCurrent
      - us-gaap:ShortTermBorrowings
  diluted_shares:
    kind: latest
    unit: shares
    tags: [us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding]
  shares_outstanding:
    kind: instant
    unit: shares
    tags: [dei:EntityCommonStockSharesOutstanding, us-gaap:CommonStockSharesOutstanding]
