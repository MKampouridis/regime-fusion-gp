# Accounting concepts taken point-in-time from SEC filings (src/regime_fusion/data/fundamentals.py).
#
# DRAFT: the fundamental (FA) indicators are built from these concepts, and the list
# is to be matched to ActTrade's FA indicators before the recipe is frozen.
#
# Each concept lists XBRL tags in order of preference ("taxonomy:concept"). Flows
# (income and cash-flow items) become trailing-twelve-month values; instants
# (balance-sheet items) are the values at the latest period end. Units default to USD.

concepts:
  revenue:
    kind: flow
    tags:
      - us-gaap:Revenues
      - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
      - us-gaap:SalesRevenueNet
      - us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax
      - us-gaap:SalesRevenueGoodsNet
      - us-gaap:RevenuesNetOfInterestExpense   # banks' quarterly revenue
  operating_income:
    kind: flow
    tags: [us-gaap:OperatingIncomeLoss]
  net_income:
    kind: flow
    tags:
      - us-gaap:NetIncomeLoss
      - us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic
      - us-gaap:ProfitLoss
  operating_cash_flow:
    kind: flow
    tags:
      - us-gaap:NetCashProvidedByUsedInOperatingActivities
      - us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
  assets:
    kind: instant
    tags: [us-gaap:Assets]
  liabilities:
    kind: instant
    tags: [us-gaap:Liabilities]
  equity:
    kind: instant
    tags:
      - us-gaap:StockholdersEquity
      - us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  current_assets:
    kind: instant
    tags: [us-gaap:AssetsCurrent]
  current_liabilities:
    kind: instant
    tags: [us-gaap:LiabilitiesCurrent]
  cash:
    kind: instant
    tags:
      - us-gaap:CashAndCashEquivalentsAtCarryingValue
      - us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
  long_term_debt:
    kind: instant
    tags: [us-gaap:LongTermDebtNoncurrent, us-gaap:LongTermDebt]
  shares_outstanding:
    kind: instant
    unit: shares
    tags: [dei:EntityCommonStockSharesOutstanding, us-gaap:CommonStockSharesOutstanding]
