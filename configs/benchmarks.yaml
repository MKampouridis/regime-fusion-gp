# Non-GP benchmarks (docs/ENGINE.md, Benchmarks): rule-based (src/regime_fusion/engine/benchmarks.py)
# and machine-learning (src/regime_fusion/ml).
#
# Fairness rules (docs/RESEARCH_PLAN.md): the GP's features, windows, exit rule,
# t+1 execution and costs; tuning on validation data only; labels that match
# the exit rule; decision thresholds that maximise validation Sharpe.
# Frozen with the protocol on 31 October 2026 (designed on 2015-2018 data only).

features:
  sources: [FA, SA, TA]
  regimes: dc               # regime probabilities as features (rung A3's), and the regimes of ML-RS-LGBM
  scaling: minmax           # as the GP's, fitted on the training rows

# Buy when the predicted probability of a gaining trade is at least the q-quantile
# of the model's predictions on its training rows; q is chosen on the validation year.
quantiles: [0.5, 0.6, 0.7, 0.8, 0.9]
min_trades: 3               # as the GP's fitness: fewer trades score a Sharpe ratio of zero

rules:                      # parameters, where there are any, are chosen on the validation year
  RB-BH:                    # buy-and-hold: buy at the first open, sell at the last close (no exit rule)
    kind: buy_and_hold
  RB-TS:                    # ActTrade's TS(d, r): buy whenever flat, so the exit rule alone decides
    kind: always
  RB-MA:                    # buy while the fast moving average of closes is above the slow one
    kind: moving_average
    grid: {fast: [5, 10, 20], slow: [50, 100, 200]}
  RB-TSMOM:                 # time-series momentum: buy while the return over the look-back is positive
    kind: momentum
    grid: {lookback: [20, 60, 120, 250]}

models:
  ML-LR:                    # logistic regression: is non-linear fusion needed at all?
    kind: logistic
    runs: 1                 # deterministic
    grid: {C: [0.01, 0.1, 1.0, 10.0]}
  ML-LGBM:                  # the strongest off-the-shelf learner for tabular data
    kind: lightgbm
    runs: 1                 # deterministic given its seed
    grid: {num_leaves: [7, 15, 31], learning_rate: [0.03, 0.1], n_estimators: [100, 300]}
  ML-RS-LGBM:               # regime-switching ensemble: one LightGBM per regime
    kind: regime_lightgbm
    runs: 1
    min_rows: 100           # a regime with fewer labelled training rows uses the pooled model
    grid: {num_leaves: [7, 15, 31], learning_rate: [0.03, 0.1], n_estimators: [100, 300]}
  ML-GATED:                 # neural gated fusion: one small network per analysis type, mixed by a regime gate
    kind: gated
    runs: 10                # the plan: 10 runs for each neural model
    grid: {hidden: [8, 16], weight_decay: [0.0001, 0.001], epochs: [20, 60]}
  ML-TFT:                   # Temporal Fusion Transformer: one model across all stocks (src/regime_fusion/ml/tft.py)
    kind: tft
    runs: 10
    grid: {d_model: [16, 32], dropout: [0.1, 0.3], epochs: [10], sequence: [20], heads: [4]}
