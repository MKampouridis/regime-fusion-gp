[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-fusion-gp"
version = "0.1.0"
description = "Regime-conditioned strongly-typed genetic programming for fusing fundamental, sentiment and technical analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael Kampouridis" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pyarrow>=14",
    "exchange_calendars>=4.5",
    "numba>=0.59",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only the download commands need these; the tests never touch the network.
download = [
    "requests>=2.31",
    "yfinance>=0.2.54",
]
# The machine-learning benchmarks (src/regime_fusion/ml).
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
