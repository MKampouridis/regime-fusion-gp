[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-fusion-gp"
version = "0.1.0"
description = "Regime-conditioned strongly-typed genetic programming for fusing fundamental, sentiment and technical analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael Kampouridis" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
